<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>shareable</title>
<link rel="icon" href="/_/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: grid; place-items: center;
    background: Canvas; color: CanvasText;
  }
  main {
    max-width: 30rem; padding: 2rem; text-align: center;
  }
  h1 { font-size: 1.5rem; margin: 0 0 0.5rem; font-weight: 600; }
  p { margin: 0.25rem 0; opacity: 0.7; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: color-mix(in srgb, CanvasText 8%, transparent);
    padding: 0.1em 0.4em; border-radius: 0.3em;
  }
</style>
</head>
<body>
<main>
  <h1>shareable</h1>
  <p>shareable HTML drafts with inline comments</p>
  <p style="margin-top: 1rem;"><code>/shareable file.html</code></p>
</main>
</body>
</html>
